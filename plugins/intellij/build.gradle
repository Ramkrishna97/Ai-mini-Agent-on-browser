plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group = 'local.aiagentmini'
version = '0.3.0'

repositories { mavenCentral() }

intellij {
    // Download a compatible Community IDE by default; allow a local installation as an override.
    if (providers.gradleProperty('ideaPath').isPresent()) {
        localPath = providers.gradleProperty('ideaPath').get()
    } else {
        type = 'IC'
        version = '2023.1.3'
    }
    downloadSources = false
    updateSinceUntilBuild = false
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    from('../..') {
        include '*.py', 'index.html', 'ui.js', 'ui.css', 'requirements.txt', 'requirements-npu.txt',
                'core_tool_manifest.json', 'mcp_servers.example.json'
        into 'backend'
    }
}
tasks.named('buildSearchableOptions') { enabled = false }
tasks.named('jarSearchableOptions') { enabled = false }

patchPluginXml {
    sinceBuild = '231'
    untilBuild = ''
}
